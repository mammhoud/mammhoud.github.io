# Design Polish Prompt
# Applies a batch of visual refinements across the entire site
name: design-polish
description: Apply a batch of visual refinements across the site
arguments:
  - name: polish_instructions
    type: string
    description: List of visual refinements to apply site-wide
    required: true
  - name: check_contrast
    type: boolean
    description: Whether to verify contrast ratios after changes
    default: true
  - name: check_responsive
    type: boolean
    description: Whether to verify responsive behavior after changes
    default: true
context:
  - css/site-theme/custom-portfolio.css
  - _includes/**/*.html
  - _layouts/**/*.html
  - js/portfolio-animations.js
tools:
  - read_files
  - str_replace
  - write_file
  - npm run css:build
validation:
  - No visual regressions on desktop, tablet, or mobile
  - Consistent spacing, alignment, and typography throughout
  - All interactive elements have hover/focus states
  - Color contrast meets WCAG AA minimum where possible
  - Print styles remain intact (if relevant)

# Usage:
# Using the design-polish prompt:
# - Add 2px border to all portfolio__social-tile elements with 12px radius
# - Increase hero title letter-spacing to -0.01em
# - Add a subtle box-shadow transition on portfolio__badge hover
# - Reduce the essay card border-radius to 1rem
# - Make the navbar-brand bold on scroll
