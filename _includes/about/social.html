<li class="bg-base-100 list-group-item" style="justify-items: center;">
  <svg class="tf-social">
    <use xlink:href="{{ '/img/bootstrap-icons.svg' | prepend: site.baseurl }}#{{- include.name -}}" />
  </svg>

  <div class="flex w-full items-center gap-2" style="justify-content: center;">
    <a href="{{ include.url }}" class="link link-animated" target="_blank">
      <span>{{ include.label }}</span>
    </a>

  </div>
</li>
