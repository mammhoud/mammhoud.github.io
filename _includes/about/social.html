<li class="flex flex-col items-center w-full rounded-md p-3 portfolio__social-item">
  <svg class="tf-social">
    <use xlink:href="{{ '/img/bootstrap-icons.svg' | prepend: site.baseurl }}#{{- include.name -}}" />
  </svg>

  <div class="flex w-full items-center justify-center gap-2 portfolio__social-stack">
    <a href="{{ include.url }}" class="link link-animated" target="_blank">
      <span class="text-center">{{ include.label }}</span>
    </a>

  </div>
</li>
