<li class="portfolio__social-item">
  <a href="{{ include.url }}" class="portfolio__social-link" target="_blank" rel="noopener noreferrer">
    <svg class="tf-social portfolio__social-icon" aria-hidden="true">
      <use xlink:href="{{ '/img/bootstrap-icons.svg' | prepend: site.baseurl }}#{{- include.name -}}" />
    </svg>
    <span class="portfolio__social-label">{{ include.label }}</span>
    <svg class="portfolio__social-arrow" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <line x1="5" y1="12" x2="19" y2="12"/>
      <polyline points="12 5 19 12 12 19"/>
    </svg>
  </a>
</li>
