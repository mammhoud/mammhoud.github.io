<div class="portfolio__blog-card-item{% if include.index == 1 %} portfolio__blog-card-item--featured{% endif %}">
  <div class="card h-full portfolio__card portfolio__blog-card">
    <div class="card-body flex flex-col h-full {% if include.index == 1 %}p-6 md:p-8{% else %}p-5 md:p-6{% endif %}">
      <h5 class="card-title font-semibold {% if include.index == 1 %}text-2xl md:text-3xl{% else %}text-xl{% endif %}">{{ include.page.title }}</h5>
      <p class="card-text text-sm portfolio__text--muted mb-3">{{ include.page.date | date_to_string }}</p>
      <p class="card-text flex-grow {% if include.index == 1 %}text-base leading-relaxed{% endif %}">{{ include.page.content | markdownify | strip_html | truncatewords: 40 }}</p>
      <div class="flex flex-wrap gap-2 mt-3 mb-3">
        {% for label in include.page.labels %}
        <span class="badge rounded-full portfolio__badge">{{ label }}</span>
        {% endfor %}
      </div>
      <div class="pt-2">
        <a href="{% if include.page.medium_url %}{{ include.page.medium_url }}{% elsif include.page.posturl %}{{ include.page.posturl }}{% else %}{{ site.baseurl}}{{ include.page.url }}{% endif %}" class="portfolio__button portfolio__button--read">
          <span>Read More</span>
          <svg class="portfolio__button-arrow" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="5" y1="12" x2="19" y2="12"/>
            <polyline points="12 5 19 12 12 19"/>
          </svg>
        </a>
      </div>
    </div>
  </div>
</div>
