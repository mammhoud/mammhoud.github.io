<article class="bento-card bento-blog{% if include.index == 1 %} bento-blog--featured{% endif %}">
  <p class="bento-kicker">{{ include.page.date | date_to_string }}</p>
  <h3>{{ include.page.title }}</h3>
  <p>{{ include.page.content | markdownify | strip_html | truncatewords: 30 }}</p>
  <div class="bento-chip-cloud">
    {% for label in include.page.labels limit:3 %}<span class="portfolio__badge bento-chip">{{ label }}</span>{% endfor %}
  </div>
  <a href="{% if include.page.medium_url %}{{ include.page.medium_url }}{% elsif include.page.posturl %}{{ include.page.posturl }}{% else %}{{ site.baseurl}}{{ include.page.url }}{% endif %}" class="portfolio__button portfolio__button--read">Read More</a>
</article>
