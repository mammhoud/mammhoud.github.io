<article class="bento-card bento-project{% if include.index == 1 %} bento-project--featured{% endif %}">
  {% if include.page.image %}<img src="{{ site.baseurl }}/{{ include.page.image }}" class="bento-project__image portfolio__project-image" alt="{{ include.page.title }}">{% endif %}
  <div class="bento-project__body">
    <p class="bento-kicker">{{ include.page.date }}</p>
    <h3>{{ include.page.title }}</h3>
    <p>{{ include.page.summary }}</p>
    <div class="bento-chip-cloud">
      {% for label in include.page.labels limit:4 %}<span class="portfolio__badge bento-chip">{{ label }}</span>{% endfor %}
    </div>
    <a href="{% if include.page.projecturl %}{{ include.page.projecturl }}{% else %}{{ site.baseurl}}{{ include.page.url }}{% endif %}" class="portfolio__button portfolio__button--read">View Project</a>
  </div>
</article>
