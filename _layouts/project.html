---
layout: home
---

<div class="bento-shell">
  <!-- Project header -->
  <header class="post-header" data-reveal="stagger">
    <a href="{{ '/projects/' | prepend: site.baseurl }}" class="post-header__back portfolio__see-all">
      <span class="portfolio__see-all-arrow" aria-hidden="true">&larr;</span>
      All projects
    </a>
    {% if page.date %}<p class="post-header__date">{{ page.date | date: "%B %-d, %Y" }}</p>{% endif %}
    <h1 class="post-header__title">{{ page.title }}</h1>
    {% if page.labels %}
    <div class="post-header__labels">
      {% for label in page.labels %}<span class="portfolio__badge">{{ label }}</span>{% endfor %}
    </div>
    {% endif %}
    {% if page.projecturl %}
    <a href="{{ page.projecturl }}" class="portfolio__button--read" style="margin-top: 1rem; display: inline-flex;">
      View Project
      <span class="portfolio__button-arrow" aria-hidden="true">&rarr;</span>
    </a>
    {% endif %}
  </header>

  <!-- Project content -->
  <article class="post-body bento-card" data-reveal>
    {{ content }}
  </article>
</div>
